name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Build (base-href = /${{ github.event.repository.name }}/)
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Fallback SPA (404 -> index)
        run: cp dist/portfolio-app/browser/index.html dist/portfolio-app/browser/404.html

      - name: .nojekyll
        run: touch dist/portfolio-app/browser/.nojekyll

      - name: Upload artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
